<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chalkboard Tic-Tac-Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Archivo:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --slate-1: #33453d;
    --slate-2: #29392f;
    --slate-3: #23322a;
    --wood-1: #8a5a3a;
    --wood-2: #6b4327;
    --wood-3: #4a2e1a;
    --chalk: #f3ede1;
    --chalk-dim: #b9c4b6;
    --chalk-faint: rgba(243, 237, 225, 0.16);
    --x-color: #e8a06a;
    --x-glow: rgba(232, 160, 106, 0.45);
    --o-color: #8fc3ce;
    --o-glow: rgba(143, 195, 206, 0.45);
    --win-color: #f3ede1;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8vh 5vw;
    background: radial-gradient(ellipse at 50% 20%, #263229 0%, #17201b 70%, #10160f 100%);
    font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif;
    color: var(--chalk);
    -webkit-font-smoothing: antialiased;
  }

  .frame {
    position: relative;
    padding: 14px;
    border-radius: 22px;
    background:
      linear-gradient(155deg, var(--wood-1), var(--wood-2) 45%, var(--wood-3));
    box-shadow:
      0 30px 60px -20px rgba(0, 0, 0, 0.65),
      0 2px 0 rgba(255, 255, 255, 0.05) inset;
  }

  .frame::before {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 16px;
    border: 1px solid rgba(0, 0, 0, 0.25);
    pointer-events: none;
  }

  .board-panel {
    width: min(92vw, 480px);
    border-radius: 12px;
    padding: 34px 32px 28px;
    background:
      radial-gradient(ellipse at 30% 15%, rgba(255,255,255,0.05), transparent 55%),
      linear-gradient(165deg, var(--slate-1), var(--slate-2) 55%, var(--slate-3));
    box-shadow: inset 0 0 60px rgba(0,0,0,0.45), inset 0 2px 4px rgba(0,0,0,0.5);
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
  }

  h1 {
    margin: 0;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: clamp(2.4rem, 8vw, 3rem);
    line-height: 0.85;
    letter-spacing: 0.5px;
    color: var(--chalk);
    text-shadow: 0 0 14px var(--chalk-faint);
    transform: rotate(-1.2deg);
    text-wrap: balance;
  }

  .tally {
    display: flex;
    gap: 14px;
    font-family: 'Space Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }

  .tally-item {
    text-align: center;
    min-width: 34px;
  }

  .tally-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin: 0 auto 5px;
  }

  .tally-item.x .tally-dot { background: var(--x-color); box-shadow: 0 0 6px var(--x-glow); }
  .tally-item.o .tally-dot { background: var(--o-color); box-shadow: 0 0 6px var(--o-glow); }
  .tally-item.d .tally-dot { background: var(--chalk-dim); }

  .tally-count {
    font-size: 1.05rem;
    font-weight: 700;
    display: block;
  }

  .tally-label {
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    color: var(--chalk-dim);
    text-transform: uppercase;
    display: block;
    margin-top: 2px;
  }

  .status {
    text-align: center;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    margin-bottom: 20px;
    min-height: 1.2em;
    transition: color 0.2s ease;
  }

  .status .accent-x { color: var(--x-color); }
  .status .accent-o { color: var(--o-color); }
  .status.win { color: var(--chalk); }

  .role-tag {
    display: block;
    width: fit-content;
    margin: 0 auto 14px;
    font-family: 'Space Mono', ui-monospace, monospace;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    border: 1px solid var(--chalk-faint);
    border-radius: 999px;
    padding: 6px 16px;
  }

  .role-tag.x { color: var(--x-color); border-color: var(--x-color); box-shadow: 0 0 10px var(--x-glow); }
  .role-tag.o { color: var(--o-color); border-color: var(--o-color); box-shadow: 0 0 10px var(--o-glow); }

  .timer-track {
    width: 100%;
    max-width: 380px;
    margin: 0 auto 16px;
    height: 6px;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.35);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .timer-track.show { opacity: 1; }

  .timer-fill {
    height: 100%;
    width: 100%;
    border-radius: 4px;
    background: #8fd18f;
    transition: width 0.08s linear, background-color 0.15s ease;
  }

  .timer-fill.warn { background: #e8c25a; }
  .timer-fill.danger { background: #e0645a; }

  .board-wrap {
    position: relative;
    width: 100%;
    max-width: 380px;
    margin: 0 auto;
    height: 0;
    padding-bottom: 100%;
  }

  @supports (aspect-ratio: 1) {
    .board-wrap {
      height: auto;
      padding-bottom: 0;
      aspect-ratio: 1;
    }
  }

  .board {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
  }

  .line {
    position: absolute;
    background: var(--chalk);
    filter: url(#chalkRough);
    box-shadow: 0 0 8px var(--chalk-faint);
    opacity: 0.9;
    border-radius: 3px;
  }

  .line.v {
    top: 2%;
    bottom: 2%;
    width: 5px;
  }
  .line.v1 { left: calc(33.333% - 2.5px); transform: rotate(-0.6deg); }
  .line.v2 { left: calc(66.666% - 2.5px); transform: rotate(0.5deg); }

  .line.h {
    left: 2%;
    right: 2%;
    height: 5px;
  }
  .line.h1 { top: calc(33.333% - 2.5px); transform: rotate(0.4deg); }
  .line.h2 { top: calc(66.666% - 2.5px); transform: rotate(-0.5deg); }

  .cell {
    background: transparent;
    border: none;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .cell:focus-visible {
    outline: 2px solid var(--chalk);
    outline-offset: -6px;
    border-radius: 8px;
  }

  .cell svg {
    width: 56%;
    height: 56%;
    overflow: visible;
  }

  .cell .mark-path {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: url(#chalkRough);
  }

  .cell.x .mark-path { stroke: var(--x-color); filter: url(#chalkRough) drop-shadow(0 0 6px var(--x-glow)); }
  .cell.o .mark-path { stroke: var(--o-color); filter: url(#chalkRough) drop-shadow(0 0 6px var(--o-glow)); }

  .mark-draw {
    stroke-dasharray: 140;
    stroke-dashoffset: 140;
    animation: draw 0.38s ease forwards;
  }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  .cell.win .mark-path {
    stroke-width: 16;
  }

  .cell.win.x .mark-path { filter: url(#chalkRough) drop-shadow(0 0 16px var(--x-glow)); }
  .cell.win.o .mark-path { filter: url(#chalkRough) drop-shadow(0 0 16px var(--o-glow)); }

  .cell.win svg {
    animation: winPop 0.35s ease forwards;
  }

  @keyframes winPop {
    0% { transform: scale(1); }
    60% { transform: scale(1.16); }
    100% { transform: scale(1.08); }
  }

  footer {
    margin-top: 24px;
    display: flex;
    justify-content: center;
  }

  .reset-btn {
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--slate-3);
    background: var(--chalk);
    border: none;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .reset-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
  .reset-btn:active { transform: translateY(0); }
  .reset-btn:focus-visible { outline: 2px solid var(--chalk); outline-offset: 3px; }

  footer { gap: 12px; }

  .reset-scores-btn {
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    background: transparent;
    border: 1px solid var(--chalk-faint);
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .reset-scores-btn:hover { transform: translateY(-1px); color: var(--chalk); border-color: var(--chalk-dim); }
  .reset-scores-btn:active { transform: translateY(0); }
  .reset-scores-btn:focus-visible { outline: 2px solid var(--chalk); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .mark-draw { animation: none; stroke-dashoffset: 0; }
    .cell.win svg { animation: none; transform: scale(1.08); }
    .reset-btn { transition: none; }
  }
</style>

<svg width="0" height="0" style="position:absolute">
  <filter id="chalkRough" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"></feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2"></feDisplacementMap>
  </filter>
</svg>

<div class="frame">
  <div class="board-panel">
    <header>
      <h1>Tic&nbsp;·&nbsp;Tac&nbsp;·&nbsp;Toe</h1>
      <div class="tally">
        <div class="tally-item x">
          <div class="tally-dot"></div>
          <span class="tally-count" id="scoreX">0</span>
          <span class="tally-label">X</span>
        </div>
        <div class="tally-item d">
          <div class="tally-dot"></div>
          <span class="tally-count" id="scoreD">0</span>
          <span class="tally-label">Draw</span>
        </div>
        <div class="tally-item o">
          <div class="tally-dot"></div>
          <span class="tally-count" id="scoreO">0</span>
          <span class="tally-label">O</span>
        </div>
      </div>
    </header>

    <div class="role-tag" id="roleTag">Connecting…</div>
    <div class="status" id="status" role="status" aria-live="polite">
      <span class="accent-x">X</span>&nbsp;to draw
    </div>
    <div class="timer-track" id="timerTrack"><div class="timer-fill" id="timerFill"></div></div>

    <div class="board-wrap">
      <div class="board" id="board">
        <div class="line v v1"></div>
        <div class="line v v2"></div>
        <div class="line h h1"></div>
        <div class="line h h2"></div>
        <!-- cells injected by JS -->
      </div>
    </div>

    <footer>
      <button class="reset-btn" id="resetBtn">New game</button>
      <button class="reset-scores-btn" id="resetScoresBtn">Reset scores</button>
    </footer>
  </div>
</div>

<script>
(function () {
  var boardEl = document.getElementById('board');
  var statusEl = document.getElementById('status');
  var roleTagEl = document.getElementById('roleTag');
  var resetBtn = document.getElementById('resetBtn');
  var resetScoresBtn = document.getElementById('resetScoresBtn');
  var scoreXEl = document.getElementById('scoreX');
  var scoreOEl = document.getElementById('scoreO');
  var scoreDEl = document.getElementById('scoreD');
  var timerTrackEl = document.getElementById('timerTrack');
  var timerFillEl = document.getElementById('timerFill');

  var cells = [];
  var lastVersion = -1;
  var timeLimit = 2;
  var deadlineAt = null; // local Date.now()-based estimate of when the timer hits 0

  function getPid() {
    var pid = sessionStorage.getItem('ttt-pid');
    if (!pid) {
      pid = 'p-' + Math.random().toString(36).slice(2) + '-' + Math.random().toString(36).slice(2);
      sessionStorage.setItem('ttt-pid', pid);
    }
    return pid;
  }

  var pid = getPid();

  function api(path, body) {
    var opts = body
      ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
      : { method: 'GET' };
    return fetch(path, opts).then(function (r) { return r.json(); });
  }

  function renderScores(scores) {
    scoreXEl.textContent = scores.X;
    scoreOEl.textContent = scores.O;
    scoreDEl.textContent = scores.D;
  }

  function xMarkSVG() {
    return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<path class="mark-path mark-draw" d="M20 20 L80 80" stroke-width="12"></path>' +
      '<path class="mark-path mark-draw" d="M80 20 L20 80" stroke-width="12" style="animation-delay:0.08s"></path>' +
      '</svg>';
  }

  function oMarkSVG() {
    return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<circle class="mark-path mark-draw" cx="50" cy="50" r="32" stroke-width="12" ' +
      'style="stroke-dasharray:201;stroke-dashoffset:201;"></circle>' +
      '</svg>';
  }

  function buildBoard() {
    for (var i = 0; i < 9; i++) {
      var btn = document.createElement('button');
      btn.className = 'cell';
      btn.type = 'button';
      btn.disabled = true;
      btn.setAttribute('aria-label', 'Cell ' + (i + 1));
      btn.addEventListener('click', (function (idx) {
        return function () { play(idx); };
      })(i));
      boardEl.appendChild(btn);
      cells.push(btn);
    }
  }

  function setStatus(html, extraClass) {
    statusEl.innerHTML = html;
    statusEl.className = 'status' + (extraClass ? ' ' + extraClass : '');
  }

  function play(idx) {
    api('/api/move', { pid: pid, index: idx }).then(render);
  }

  function renderRole(state) {
    if (state.role === 'X') {
      roleTagEl.textContent = 'You are playing X';
      roleTagEl.className = 'role-tag x';
    } else if (state.role === 'O') {
      roleTagEl.textContent = 'You are playing O';
      roleTagEl.className = 'role-tag o';
    } else {
      roleTagEl.textContent = 'Spectating';
      roleTagEl.className = 'role-tag';
    }
  }

  function renderStatus(state) {
    if (state.over) {
      if (state.winner === 'D') {
        setStatus('Board full — a draw', 'win');
      } else {
        var accent = state.winner === 'X' ? 'accent-x' : 'accent-o';
        var youWon = state.role === state.winner ? ' — you win!' : '';
        setStatus('<span class="' + accent + '">' + state.winner + '</span>&nbsp;wins the board' + youWon, 'win');
      }
      return;
    }
    if (!state.players.X || !state.players.O) {
      setStatus('Waiting for a second player to join…');
      return;
    }
    var turnAccent = state.turn === 'X' ? 'accent-x' : 'accent-o';
    if (state.role === state.turn) {
      setStatus('<span class="' + turnAccent + '">Your move (' + state.turn + ')</span>');
    } else if (state.role === 'spectator') {
      setStatus('<span class="' + turnAccent + '">' + state.turn + '</span>&nbsp;to draw');
    } else {
      setStatus('Waiting for <span class="' + turnAccent + '">' + state.turn + '</span>&nbsp;to move');
    }
  }

  function renderBoard(state) {
    for (var i = 0; i < 9; i++) {
      var mark = state.board[i];
      var cell = cells[i];
      if (mark && !cell.classList.contains(mark.toLowerCase())) {
        cell.classList.add(mark.toLowerCase());
        cell.innerHTML = mark === 'X' ? xMarkSVG() : oMarkSVG();
      } else if (!mark) {
        cell.className = 'cell';
        cell.innerHTML = '';
      }
      var canPlay = !state.over && !mark && state.role === state.turn;
      cell.disabled = !canPlay;
    }
  }

  function render(state) {
    if (state.error || state.version === lastVersion) return;
    lastVersion = state.version;
    renderRole(state);
    renderStatus(state);
    renderBoard(state);
    renderScores(state.scores);

    if (!state.over && typeof state.time_left === 'number') {
      timeLimit = state.time_limit || timeLimit;
      deadlineAt = Date.now() + state.time_left * 1000;
    } else {
      deadlineAt = null;
    }

    renderWinHighlight(state);
  }

  function renderWinHighlight(state) {
    for (var i = 0; i < 9; i++) {
      cells[i].classList.remove('win');
    }
    if (state.over && state.line) {
      state.line.forEach(function (i) { cells[i].classList.add('win'); });
    }
  }

  function tickTimer() {
    if (deadlineAt == null) {
      timerTrackEl.classList.remove('show');
    } else {
      var remaining = Math.max(0, deadlineAt - Date.now());
      var frac = timeLimit > 0 ? remaining / (timeLimit * 1000) : 0;
      timerTrackEl.classList.add('show');
      timerFillEl.style.width = (frac * 100) + '%';
      timerFillEl.classList.toggle('warn', frac <= 0.5 && frac > 0.25);
      timerFillEl.classList.toggle('danger', frac <= 0.25);
    }
    requestAnimationFrame(tickTimer);
  }

  function poll() {
    api('/api/state?pid=' + encodeURIComponent(pid)).then(render).catch(function () {
      roleTagEl.textContent = 'Disconnected — retrying…';
    });
  }

  requestAnimationFrame(tickTimer);

  function newGame() {
    api('/api/new-game', { pid: pid }).then(function (state) {
      lastVersion = -1;
      render(state);
    });
  }

  function resetScores() {
    api('/api/reset-scores', { pid: pid }).then(function (state) {
      lastVersion = -1;
      render(state);
    });
  }

  resetBtn.addEventListener('click', newGame);
  resetScoresBtn.addEventListener('click', resetScores);

  buildBoard();
  api('/api/join', { pid: pid }).then(function (state) {
    lastVersion = -1;
    render(state);
    setInterval(poll, 250);
  });
})();
</script>
